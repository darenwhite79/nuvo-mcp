name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Dependencies
        run: uv sync --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

  smoke:
    name: Runs as it is
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # With no key the server has to explain itself in human words rather than
      # die with a traceback: that is the first thing someone sees after
      # installing the package.
      - name: No key — a readable refusal
        run: |
          out=$(uvx --from . nuvo-mcp 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "NUVO_TOKEN" || { echo "Said nothing about the key"; exit 1; }
          echo "$out" | grep -qi "traceback" && { echo "Died with a traceback"; exit 1; }
          exit 0
